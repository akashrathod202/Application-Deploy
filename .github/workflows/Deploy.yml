
name: Node.js CI

on:
  push:
    branches:
      - main

jobs:
  first-workflow:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Connect GitHub Actions to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # Step 2: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 3: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 4: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 5: Validate application
      - name: Validate Node.js application
        run: node --check index.js

      # Step 6: Build Docker image
      - name: Build Docker image
        run: docker build -t node-app:ci .

      # Step 7: Test AWS Systems Manager connection
      - name: Test AWS SSM connection
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0fda4ed287ec28b2d" \
            --document-name "AWS-RunShellScript" \
            --comment "Testing GitHub Actions to EC2 connection" \
            --parameters 'commands=["whoami"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0fda4ed287ec28b2d"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0fda4ed287ec28b2d" \
            --query "StandardOutputContent" \
            --output text

      # Step 8: Welcome message
      - name: Welcome message
        run: echo "My first GitHub Actions workflow is running!"
