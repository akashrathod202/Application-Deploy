 
name: Node.js CI

on:
  push:
    branches:
      - main

jobs:
  first-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install dependencies
        run: npm ci

      - name: Validate Node.js application
        run: node --check index.js

      - name: Build Docker image
        run: docker build -t node-app:ci .

      - name: Welcome message
        run: echo "My first GitHub Actions workflow is running!"
